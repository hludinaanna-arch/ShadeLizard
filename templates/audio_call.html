<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аудиозвонок - MySocial</title>
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #2f3450;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #262541;
            color: #DFD9D8;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-btn {
            color: #DFD9D8;
            text-decoration: none;
            padding: 8px 15px;
            background: #2f3450;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #262541;
        }
        
        .call-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .audio-box {
            background: linear-gradient(0deg, #1f1e34 25%, #262541 100%);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.835);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }  
        .audio-box h2 {
            color: #DFD9D8;
            margin-bottom: 15px;
            font-size: 2em;
        }
        
        .audio-box p {
            color: #DFD9D8;
            margin-bottom: 30px;
        }
        
        .jitsi-frame {
            width: 100%;
            height: 600px;
            background: #DFD9D8;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .jitsi-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* ✅ Адаптивность для мобильных устройств */
@media (max-width: 768px) {
    .container {
        padding: 20px !important;
        margin: 10px !important;
    }
    
    h1 {
        font-size: 1.5em !important;
    }
    
    .btn {
        padding: 15px 20px !important;
        font-size: 16px !important;
    }
    
    .share-link {
        flex-direction: column !important;
        padding: 10px !important;
        font-size: 0.8em !important;
    }
    
    .share-link code {
        font-size: 0.75em !important;
        padding: 6px 10px !important;
    }
    
    .header {
        flex-direction: column !important;
        gap: 10px !important;
        text-align: center !important;
    }
    
    .header h1 {
        font-size: 1.2em !important;
    }
    
    .messages {
        padding: 10px !important;
    }
    
    .message {
        max-width: 85% !important;
        font-size: 0.9em !important;
    }
    
    .input-area {
        flex-direction: column !important;
    }
    
    .input-area button {
        width: 100% !important;
    }
    
    .username-input {
        flex-direction: column !important;
        gap: 5px !important;
    }
    
    .username-input input {
        margin-left: 0 !important;
        width: 100% !important;
    }
}

/* ✅ Для очень маленьких экранов (телефоны) */
@media (max-width: 480px) {
    body {
        padding: 5px !important;
    }
    
    .container {
        padding: 15px !important;
    }
    
    h1 {
        font-size: 1.3em !important;
    }
    
    .subtitle {
        font-size: 0.9em !important;
    }
    
    .btn {
        padding: 12px 15px !important;
        font-size: 14px !important;
    }
}
    </style>
</head>
<body>
    <div class="header">
        <h1> Аудиозвонок</h1>
        <a href="/" class="back-btn">← На главную</a>
    </div>
    
    <div class="call-container">
        <div class="audio-box">
            <h2>Аудиовызов</h2>
            <p>Видео отключено — только голос</p>
            
            <div class="jitsi-frame">
                <iframe 
                    src="https://meet.jit.si/MySocialAudioRoom?config.startWithVideoMuted=true&config.disableDeepLinking=true" 
                    allow="microphone; speaker"
                ></iframe>
            </div>
        </div>
    </div>
</body>
</html>
