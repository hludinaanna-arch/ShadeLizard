<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Комната: {{ room_name }} - MySocial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1f1e34;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: #2f3450;
            color: #DFD9D8;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .header h1 { font-size: 1.5em; color: #ffffff; }
        .room-info { font-size: 0.9em; opacity: 0.9; color: #DFD9D8; }
        
        .back-btn {
            color: #DFD9D8;
            text-decoration: none;
            padding: 8px 15px;
            background: #515a8a;
            border-radius: 5px;
            white-space: nowrap;
        }
        
        .share-link {
            padding: 12px;
            background: #505081;
            text-align: center;
            font-size: 0.9em;
            color: #DFD9D8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        
        .share-link code {
            background: #f4f3f0;
            padding: 6px 12px;
            border-radius: 5px;
            color: #515a8a;
            font-weight: bold;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s;
            max-width: 100%;
        }
        
        #copyStatus {
            color: #4CAF50;
            font-weight: bold;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .connection-status {
            padding: 10px;
            background: #ff6b6b;
            color: white;
            text-align: center;
            display: none;
            flex-shrink: 0;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 10px auto;
            background: #2f3450;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            min-height: 0;
        }
        
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
            color: #DFD9D8;
        }
        
        .message.incoming {
            background: #505081;
            align-self: flex-start;
        }
        
        .message.outgoing {
            background: #4E60AE;
            align-self: flex-end;
        }
        
        .message.system {
            background: #3d4368d9;
            align-self: center;
            font-style: italic;
            font-size: 0.9em;
            max-width: 90%;
        }
        
        .message .username {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 3px;
        }
        
        /* Стили для фото в чате */
        .message img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .message img:hover {
            transform: scale(1.02);
        }
        
        .voice-message audio {
            max-width: 200px;
            height: 30px;
            margin-top: 5px;
        }
        
        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #505081;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        
        .input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #DFD9D8;
            border-radius: 20px;
            outline: none;
            background: #1f1e34;
            color: #DFD9D8;
            min-width: 0;
        }
        
        .input-area button {
            padding: 10px 20px;
            background: #505081;
            color: #DFD9D8;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 1.2em;
        }
        
        /* Кнопки микрофона и фото */
        .icon-btn {
            background: #505081;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 1.3em;
            cursor: pointer;
            border: none;
            color: #DFD9D8;
            transition: all 0.3s;
        }
        
        .icon-btn:hover {
            background: #3d4368;
            transform: scale(1.05);
        }
        
        #micBtn.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }
        
        /* Предпросмотр фото перед отправкой */
        .preview-container {
            position: relative;
            display: none;
            padding: 10px;
            background: #505081;
            border-top: 1px solid #3d4368;
        }
        
        .preview-container.active {
            display: block;
        }
        
        .preview-container img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 10px;
        }
        
        .preview-close {
            position: absolute;
            top: 5px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
        }
        
        .username-input {
            padding: 10px 15px;
            background: #505081;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #DFD9D8;
            flex-shrink: 0;
        }
        
        .username-input input {
            padding: 8px;
            border: 1px solid #DFD9D8;
            border-radius: 5px;
            background: #1f1e34;
            color: #DFD9D8;
            flex: 1;
            min-width: 0;
        }
        
        /* Модальное окно для просмотра фото */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .image-modal.active {
            display: flex;
        }
        
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; text-align: center; padding: 10px; }
            .header h1 { font-size: 1.2em; }
            .share-link { flex-direction: column; padding: 10px; font-size: 0.8em; }
            .share-link code { font-size: 0.75em; width: 100%; }
            .chat-container { margin: 5px; border-radius: 5px; }
            .messages { padding: 10px; }
            .message { max-width: 85%; font-size: 0.9em; }
            .username-input { flex-direction: column; align-items: flex-start; }
            .username-input input { width: 100%; }
        }
        
        @media (max-width: 480px) {
            .header h1 { font-size: 1em; }
            .back-btn { padding: 6px 10px; font-size: 0.85em; }
            .input-area { padding: 8px; }
            .input-area input[type="text"] { padding: 8px; font-size: 14px; }
            #sendBtn { padding: 8px 15px; font-size: 14px; }
            .icon-btn { width: 40px; height: 40px; font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div id="connectionStatus" class="connection-status">
        ⚠️ Подключение к серверу... Подождите несколько секунд.
    </div>
    
    <div class="header">
        <div>
            <h1 id="roomTitle">Комната: {{ room_name }}</h1>
            <div class="room-info">Приватный чат</div>
        </div>
        <a href="/" class="back-btn">← На главную</a>
    </div>
    
    <div class="share-link">
        <span> Ссылка:</span>
        <code id="roomLink">Загрузка...</code>
        <span id="copyStatus">Скопировано!</span>
    </div>
    
    <div class="chat-container">
        <div class="username-input">
            <label>Никнейм:</label>
            <input type="text" id="username" placeholder="Введите ваш никнейм">
        </div>
        
        <div class="messages" id="messages"></div>
        
        <!-- Предпросмотр фото -->
        <div class="preview-container" id="previewContainer">
            <img id="previewImage" src="" alt="Предпросмотр">
            <button class="preview-close" onclick="closePreview()">✕</button>
        </div>
        
        <div class="input-area">
            <button id="micBtn" class="icon-btn" title="Голосовое сообщение">🎙️</button>
            <button id="photoBtn" class="icon-btn" title="Отправить фото">📷</button>
            <input type="file" id="photoInput" accept="image/*" style="display: none;">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Модальное окно для просмотра фото -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <img id="modalImage" src="" alt="">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const roomName = '{{ room_name }}';
        
        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: 10,
            timeout: 20000
        });
        
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const micBtn = document.getElementById('micBtn');
        const photoBtn = document.getElementById('photoBtn');
        const photoInput = document.getElementById('photoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        
        const roomLink = window.location.origin + '/chat/' + roomName;
        document.getElementById('roomLink').textContent = roomLink;
        
        document.getElementById('roomLink').addEventListener('mouseenter', copyToClipboard);
        document.getElementById('roomLink').addEventListener('touchstart', function(e) {
            e.preventDefault();
            copyToClipboard();
        });
        
        function copyToClipboard() {
            navigator.clipboard.writeText(roomLink).then(function() {
                const status = document.getElementById('copyStatus');
                status.style.opacity = '1';
                setTimeout(function() { status.style.opacity = '0'; }, 2000);
            });
        }
        
        // --- ГОЛОСОВЫЕ СООБЩЕНИЯ ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingStartTime;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            const duration = Math.round((Date.now() - recordingStartTime) / 1000);
                            
                            socket.emit('message', { 
                                username: username, 
                                message: base64Audio, 
                                room: roomName,
                                type: 'voice',
                                duration: duration
                            });
                        };
                    };

                    mediaRecorder.start();
                    recordingStartTime = Date.now();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.textContent = '⏹️';
                    messageInput.placeholder = "Идет запись... Нажмите чтобы остановить";
                    messageInput.disabled = true;
                    
                } catch (err) {
                    alert('Нужен доступ к микрофону!');
                    console.error(err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎙️';
                messageInput.placeholder = "Напишите сообщение...";
                messageInput.disabled = false;
            }
        });
        // ----------------------------------

        // --- ОТПРАВКА ФОТО ---
        photoBtn.addEventListener('click', () => {
            photoInput.click();
        });
        
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Проверка размера (максимум 2 МБ)
            if (file.size > 2 * 1024 * 1024) {
                alert('Фото слишком большое! Максимум 2 МБ.');
                photoInput.value = '';
                return;
            }
            
            // Проверка типа файла
            if (!file.type.startsWith('image/')) {
                alert('Это не изображение!');
                photoInput.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(event) {
                previewImage.src = event.target.result;
                previewContainer.classList.add('active');
            };
            reader.readAsDataURL(file);
        });
        
        function closePreview() {
            previewContainer.classList.remove('active');
            previewImage.src = '';
            photoInput.value = '';
        }
        
        function sendPhoto() {
            const base64Image = previewImage.src;
            if (!base64Image || base64Image === window.location.href) return;
            
            if (!username) {
                alert('Сначала введите никнейм!');
                return;
            }
            
            socket.emit('message', {
                username: username,
                message: base64Image,
                room: roomName,
                type: 'image'
            });
            
            closePreview();
        }
        // ----------------------------------

        function saveRoomToHistory(name, title) {
            let rooms = [];
            try { rooms = JSON.parse(localStorage.getItem('my_rooms') || '[]'); } catch(e) {}
            let room = rooms.find(r => r.name === name);
            if (room) {
                room.title = title;
                if (username && !room.participants.includes(username)) room.participants.push(username);
            } else {
                room = { name: name, title: title, participants: username ? [username] : [], date: new Date().toLocaleString('ru-RU') };
                rooms.unshift(room);
            }
            rooms = rooms.slice(0, 20);
            localStorage.setItem('my_rooms', JSON.stringify(rooms));
        }
        
        let username = '';
        
        window.addEventListener('DOMContentLoaded', function() {
            const savedUsername = localStorage.getItem('chat_username_' + roomName);
            if (savedUsername) {
                username = savedUsername;
                usernameInput.value = savedUsername;
                socket.emit('join', { username: username, room: roomName, is_reconnect: true });
                saveRoomToHistory(roomName, 'Комната ' + roomName);
                messageInput.focus();
            } else {
                usernameInput.focus();
            }
        });
        
        usernameInput.addEventListener('change', function() {
            username = this.value;
            if (username) {
                localStorage.setItem('chat_username_' + roomName, username);
                if (socket.connected) {
                    socket.emit('join', { username: username, room: roomName, is_reconnect: false });
                    saveRoomToHistory(roomName, 'Комната ' + roomName);
                } else {
                    socket.on('connect', function() {
                        socket.emit('join', { username: username, room: roomName, is_reconnect: false });
                        saveRoomToHistory(roomName, 'Комната ' + roomName);
                    });
                }
                messageInput.focus();
            }
        });
        
        // ОБРАБОТКА СООБЩЕНИЙ
        socket.on('message', function(data) {
            const messageDiv = document.createElement('div');
            
            if (data.username === 'Система') {
                messageDiv.className = 'message system';
                messageDiv.innerHTML = `<div>${data.message}</div>`;
            } else if (data.type === 'voice') {
                const duration = data.duration || 0;
                const durationText = duration < 60 ? `${duration} сек` : `${Math.floor(duration/60)}:${(duration%60).toString().padStart(2, '0')}`;
                
                messageDiv.className = 'message voice-message ' + (data.username === username ? 'outgoing' : 'incoming');
                messageDiv.innerHTML = `
                    <div class="username">${data.username} ️ <span style="font-size: 0.8em; opacity: 0.7;">${durationText}</span></div>
                    <audio controls src="${data.message}" style="max-width: 200px; height: 30px; margin-top: 5px;"></audio>
                `;
            } else if (data.type === 'image') {
                // Фото
                messageDiv.className = 'message ' + (data.username === username ? 'outgoing' : 'incoming');
                messageDiv.innerHTML = `
                    <div class="username">${data.username} 📷</div>
                    <img src="${data.message}" onclick="openImageModal('${data.message}')" alt="Фото">
                `;
            } else {
                // Обычный текст
                messageDiv.className = 'message ' + (data.username === username ? 'outgoing' : 'incoming');
                messageDiv.innerHTML = `
                    <div class="username">${data.username}</div>
                    <div>${data.message}</div>
                `;
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        
        function sendMessage() {
            const message = messageInput.value;
            if (message && username) {
                socket.emit('message', { username: username, message: message, room: roomName });
                messageInput.value = '';
                messageInput.focus();
            }
        }
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Модальное окно для фото
        function openImageModal(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.add('active');
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
        
        socket.on('connect', () => document.getElementById('connectionStatus').style.display = 'none');
        socket.on('disconnect', () => document.getElementById('connectionStatus').style.display = 'block');
        socket.on('connect_error', () => document.getElementById('connectionStatus').style.display = 'block');
        
        window.addEventListener('beforeunload', function() {
            if (username) socket.emit('leave', { username: username, room: roomName });
        });
    </script>
</body>
</html>
