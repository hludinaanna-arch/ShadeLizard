<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната: {{ room_name }} - MySocial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1f1e34;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2f3450;
            color: #DFD9D8;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { font-size: 1.5em; color: #ffffff; }
        .room-info { font-size: 0.9em; opacity: 0.9; color: #DFD9D8; }
        
        .back-btn {
            color: #DFD9D8;
            text-decoration: none;
            padding: 8px 15px;
            background: #515a8a;
            border-radius: 5px;
        }
        
        .share-link {
            padding: 15px;
            background: #505081;
            text-align: center;
            font-size: 0.9em;
            color: #DFD9D8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .share-link code {
            background: #f4f3f0;
            padding: 8px 15px;
            border-radius: 5px;
            color: #515a8a;
            font-weight: bold;
            word-break: break-all;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .share-link code:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }
        
        /* ✅ Простая зелёная надпись без фона и рамки */
        #copyStatus {
            color: #4CAF50;
            font-weight: bold;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .connection-status {
            padding: 10px;
            background: #ff6b6b;
            color: white;
            text-align: center;
            display: none;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            background: #2f3450;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.835);
            overflow: hidden;
        }
        
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
            color: #DFD9D8;
        }
        
        .message.incoming {
            background: #505081;
            align-self: flex-start;
        }
        
        .message.outgoing {
            background: #4E60AE;
            align-self: flex-end;
        }
        
        .message.system {
            background: #3d4368d9;
            align-self: center;
            font-style: italic;
            font-size: 0.9em;
        }
        
        .message .username {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 3px;
        }
        
        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #505081;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #DFD9D8;
            border-radius: 20px;
            outline: none;
            background: #1f1e34;
            color: #DFD9D8;
        }
        
        .input-area button {
            padding: 10px 20px;
            background: #505081;
            color: #DFD9D8;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .input-area button:hover { background: #3d4368d9; }
        
        .username-input {
            padding: 10px 15px;
            background: #505081;
            text-align: left;
            color: #DFD9D8;
        }
        
        .username-input input {
            padding: 8px;
            border: 1px solid #DFD9D8;
            border-radius: 5px;
            margin-left: 10px;
            background: #1f1e34;
            color: #DFD9D8;
        }
    </style>
</head>
<body>
    <div id="connectionStatus" class="connection-status">
        ⚠️ Подключение к серверу... Подождите несколько секунд и обновите страницу.
    </div>
    
    <div class="header">
        <div>
            <h1 id="roomTitle">Комната: {{ room_name }}</h1>
            <div class="room-info">Приватный чат</div>
        </div>
        <a href="/" class="back-btn">← На главную</a>
    </div>
    
    <div class="share-link">
        <span> Наведите на ссылку, чтобы скопировать:</span>
        <code id="roomLink">Загрузка...</code>
        <span id="copyStatus">Скопировано!</span>
    </div>
    
    <div class="chat-container">
        <div class="username-input">
            <label>Ваш никнейм:</label>
            <input type="text" id="username" placeholder="Введите ваш никнейм">
        </div>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const roomName = '{{ room_name }}';
        
        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: 10,
            timeout: 20000
        });
        
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        
        const roomLink = window.location.origin + '/chat/' + roomName;
        const roomLinkElement = document.getElementById('roomLink');
        roomLinkElement.textContent = roomLink;
        
        roomLinkElement.addEventListener('mouseenter', function() {
            navigator.clipboard.writeText(roomLink).then(function() {
                const status = document.getElementById('copyStatus');
                status.style.opacity = '1';
                setTimeout(function() {
                    status.style.opacity = '0';
                }, 2000);
            }).catch(function(err) {
                console.error('Ошибка копирования:', err);
            });
        });
        
        function saveRoomToHistory(name, title) {
            let rooms = [];
            try {
                rooms = JSON.parse(localStorage.getItem('my_rooms') || '[]');
            } catch(e) {}
            
            let room = rooms.find(r => r.name === name);
            
            if (room) {
                room.title = title;
                if (username && !room.participants.includes(username)) {
                    room.participants.push(username);
                }
            } else {
                room = {
                    name: name,
                    title: title,
                    participants: username ? [username] : [],
                    date: new Date().toLocaleString('ru-RU')
                };
                rooms.unshift(room);
            }
            
            rooms = rooms.slice(0, 20);
            localStorage.setItem('my_rooms', JSON.stringify(rooms));
        }
        
        let username = '';
        
        window.addEventListener('DOMContentLoaded', function() {
            const savedUsername = localStorage.getItem('chat_username_' + roomName);
            if (savedUsername) {
                username = savedUsername;
                usernameInput.value = savedUsername;
                socket.emit('join', { username: username, room: roomName, is_reconnect: true });
                saveRoomToHistory(roomName, 'Комната ' + roomName);
                messageInput.focus();
            } else {
                usernameInput.focus();
            }
        });
        
        usernameInput.addEventListener('change', function() {
            username = this.value;
            if (username) {
                localStorage.setItem('chat_username_' + roomName, username);
                
                if (socket.connected) {
                    socket.emit('join', { username: username, room: roomName, is_reconnect: false });
                    saveRoomToHistory(roomName, 'Комната ' + roomName);
                } else {
                    socket.on('connect', function() {
                        socket.emit('join', { username: username, room: roomName, is_reconnect: false });
                        saveRoomToHistory(roomName, 'Комната ' + roomName);
                    });
                }
                
                messageInput.focus();
            }
        });
        
        socket.on('message', function(data) {
            const messageDiv = document.createElement('div');
            
            if (data.username === 'Система') {
                messageDiv.className = 'message system';
                messageDiv.innerHTML = `<div>${data.message}</div>`;
            } else {
                messageDiv.className = 'message ' + (data.username === username ? 'outgoing' : 'incoming');
                messageDiv.innerHTML = `
                    <div class="username">${data.username}</div>
                    <div>${data.message}</div>
                `;
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        
        function sendMessage() {
            const message = messageInput.value;
            if (message && username) {
                socket.emit('message', { username: username, message: message, room: roomName });
                messageInput.value = '';
                messageInput.focus();
            }
        }
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        socket.on('connect', function() {
            document.getElementById('connectionStatus').style.display = 'none';
        });
        
        socket.on('disconnect', function() {
            document.getElementById('connectionStatus').style.display = 'block';
        });
        
        socket.on('connect_error', function(error) {
            console.log('Ошибка подключения:', error);
            document.getElementById('connectionStatus').style.display = 'block';
        });
        
        window.addEventListener('beforeunload', function() {
            if (username) {
                socket.emit('leave', { username: username, room: roomName });
            }
        });
    </script>
</body>
</html>
